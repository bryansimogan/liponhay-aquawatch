name: fish_farm_app
description: "IoT-Enabled Fish Farm System for Water Quality Monitoring, Alert Notification and Corrective Action Support - Liponhay Fish Farm"
publish_to: 'none'
version: 1.7.1+10

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  firebase_auth: ^5.3.1

  # UI / Charts
  fl_chart: ^0.69.0
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.19.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^7.3.2
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/brand/
    - assets/fonts/Inter-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/AppIcon.png"
  # Adaptive icon: the emblem floats on the brand teal, inset so the
  # launcher's circle or squircle mask cannot clip the fish.
  adaptive_icon_background: "#0F4C5C"
  adaptive_icon_foreground: "assets/icon/AppIconForeground.png"
